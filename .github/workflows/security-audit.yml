name: Security Audit & AI Code Sanity Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  security-and-quality:
    name: OWASP Security Scan & TypeScript Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check TypeScript Compilation
        run: pnpm exec tsc --noEmit

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Run Dependency Audit
        run: pnpm audit --audit-level=high || true

      - name: Scan Hardcoded Secrets & Hallucinated Tokens
        shell: bash
        run: |
          echo "Scanning for potential leaked tokens, AWS keys or private keys..."
          git grep -i -E "sk_live_|AIzaSy|AKIA[0-9A-Z]{16}|BEGIN PRIVATE KEY" -- ':!*.lock' ':!node_modules' || echo "✓ No critical secrets detected in tracked files."
