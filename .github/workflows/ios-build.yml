name: Build iOS IPA & InstallOnAir OTA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js Static Export for Mobile
        run: npm run build:mobile

      - name: Sync Capacitor iOS Project
        run: |
          npx cap sync ios

      # -------------------------------------------------------------
      # BƯỚC CÀI ĐẶT CHỨNG CHỈ (NẾU CÓ CẤU HÌNH GITHUB SECRETS)
      # -------------------------------------------------------------
      - name: Install Apple Certificate and Provisioning Profile
        if: ${{ env.BUILD_CERTIFICATE_BASE64 != '' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temporary_keychain_password_123' }}
        run: |
          # 1. Tạo keychain tạm thời
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # 2. Giải mã và import file .p12 certificate
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # 3. Giải mã file Provisioning Profile
          PP_PATH=$RUNNER_TEMP/build_profile.mobileprovision
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      # -------------------------------------------------------------
      # TRƯỜNG HỢP 1: CÓ KÝ CHỨNG CHỈ (SIGNED IPA)
      # -------------------------------------------------------------
      - name: Build and Export Signed IPA
        if: ${{ env.BUILD_CERTIFICATE_BASE64 != '' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        working-directory: ./ios/App
        run: |
          # Archive dự án
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath App.xcarchive \
            archive

          # Export IPA đã ký
          xcodebuild -exportArchive \
            -archivePath App.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath output

          cp output/*.ipa ../../BatdongsanDigiKash-signed.ipa

      # -------------------------------------------------------------
      # TRƯỜNG HỢP 2: DỰ PHÒNG CHƯA CÓ SECRET (UNSIGNED IPA)
      # -------------------------------------------------------------
      - name: Build Unsigned App Archive Fallback
        if: ${{ env.BUILD_CERTIFICATE_BASE64 == '' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        working-directory: ./ios/App
        run: |
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          mkdir -p Payload
          cp -r App.xcarchive/Products/Applications/App.app Payload/
          zip -r ../../BatdongsanDigiKash-unsigned.ipa Payload
          rm -rf Payload

      # Upload Artifact IPA
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: batdongsan-digikash-ipa
          path: BatdongsanDigiKash-*.ipa
          retention-days: 14
