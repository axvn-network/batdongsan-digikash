name: Build iOS IPA & InstallOnAir OTA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js Static Export for Mobile
        run: npm run build:mobile

      - name: Sync Capacitor iOS Project
        run: |
          npx cap sync ios

      - name: Build Unsigned App Archive
        working-directory: ./ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .xcarchive into .ipa
        run: |
          mkdir -p Payload
          cp -r ios/App/App.xcarchive/Products/Applications/App.app Payload/
          zip -r BatdongsanDigiKash-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: batdongsan-digikash-unsigned-ipa
          path: BatdongsanDigiKash-unsigned.ipa
          retention-days: 14

      - name: Instructions for InstallOnAir OTA
        run: |
          echo "================================================================"
          echo "HƯỚNG DẪN CÀI ĐẶT TỪ XA QUA INSTALLONAIR (KHÔNG CẦN CÁP/MAC):"
          echo "1. Tải file BatdongsanDigiKash-unsigned.ipa từ mục Artifacts bên trên."
          echo "2. Truy cập https://www.installonair.com và kéo thả file IPA vào."
          echo "3. Lấy link hoặc mã QR quét trực tiếp bằng Safari trên iPhone để cài đặt!"
          echo "================================================================"
