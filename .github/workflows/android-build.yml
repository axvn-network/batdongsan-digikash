name: Build Android APK (Release & Debug)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js Static Export for Mobile
        run: pnpm run build:mobile
        env:
          NEXT_EXPORT: 'true'
          NEXT_PUBLIC_IS_MOBILE_APP: 'true'
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://neondb_owner:npg_BZVdz7cf3gpP@ep-rough-night-beb7hp8y-pooler.c-9.us-east-2.aws.neon.tech/neondb?sslmode=require' }}

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android Project
        run: |
          npx cap sync android

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: batdongsan-digikash-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
