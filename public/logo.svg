<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5247"/>
      <stop offset="100%" stop-color="#E03C31"/>
    </linearGradient>
  </defs>
  <!-- Interlocking Roofs (Batdongsan Iconic Symbol) -->
  <g transform="translate(10, 12)">
    <!-- Back Roof -->
    <path d="M18 48 L32 20 L46 48" fill="none" stroke="#2C2C2C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Front Roof overlapping -->
    <path d="M30 48 L44 14 L58 48" fill="none" stroke="url(#roofGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="44" cy="8" r="3.5" fill="#E03C31" />
  </g>
  <!-- Text Brand -->
  <g transform="translate(85, 46)">
    <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" fill="#2C2C2C" letter-spacing="-0.5">Batdongsan</text>
    <text x="162" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" fill="#E03C31">.com.vn</text>
    <text x="2" y="16" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="11" fill="#71717A" letter-spacing="0.2">Kênh thông tin số 1 về bất động sản</text>
  </g>
</svg>
